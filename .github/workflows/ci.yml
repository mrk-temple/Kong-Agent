# Offline test and lint only: no model API keys, no --live evaluation.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: astral-sh/setup-uv has no rolling v10 tag/branch since v8.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --python 3.12
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-sync playwright install chromium
      - name: Run tests
        run: uv run --no-sync pytest -q -r s
      - name: Verify bundled source identity
        run: uv run --no-sync python examples/local_preview_freeze.py --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Ruff (version pinned by required-version in pyproject.toml)
        run: uvx ruff@0.16.9 check .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend tests
        run: npm test
      - name: Build bundled frontend
        run: npm run build
      - name: Verify committed static resources
        run: git diff --exit-code -- ../src/kong/local_api/static

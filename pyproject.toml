[project]
name = "kong-agent"
version = "0.3.0"
description = "Kong: a goal-driven adaptive agent runtime"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.scripts]
kong = "kong.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
skills = ["pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1,<2"]
integrations = [
    "jsonschema>=4,<5",
    "mcp>=1.30,<2",
    "playwright>=1.50,<2",
    "pywinpty>=2,<4 ; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
# Exact pin so local runs and CI use the same rules; broader families stay un-adopted until inventoried.
required-version = "==0.16.9"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Script bootstraps sys.path before importing the local package; reordering would break standalone runs.
"examples/kong_eval.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/kong"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kong", "tests", "examples", ".github/workflows",
    "README.md", "ARCHITECTURE.md", "EVALUATION.md", "RECOVERY.md",
    "CHANGELOG.md", "PUBLIC_RELEASE_CHECKLIST.md", ".env.example",
    "pyproject.toml", "uv.lock", "kong.example.toml", ".gitignore",
    "LICENSE", "NOTICE",
]
exclude = [
    "**/docs/**", "**/.kong/**", "**/__pycache__/**", "**/.pytest_cache/**",
    "**/.ruff_cache/**", "**/.mypy_cache/**", "**/dist/**", "**/build/**",
    "**/api.txt", "**/kong.local.toml", "**/*.log", "**/*.sqlite*",
    "**/*.db", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx",
    "**/*.tmp", "**/*.bak", "**/*.orig", "**/*.whl", "**/*.zip",
]
